name: Ditto
description: 'DUPLICATE STUB — do not enrich. This repository was created from the
  API Evangelist secondary-market harvest backlog (Forge Global listing for "Ditto
  stock") and profiles the same legal entity already profiled in depth at all/ditto-live
  (aid ditto-live). Ditto is an edge-native data sync platform, founded in 2018 by
  Adam Fish and Max Alexander, headquartered in San Francisco, that lets mobile and
  edge devices synchronize data peer-to-peer over Bluetooth, WiFi Direct and LAN with
  or without internet connectivity, backed by an optional cloud tier. The company has
  raised roughly $136.7M across a 2021 seed, a 2023 Series A and an $82M Series B in
  March 2025. Its developer surface (ditto.live, docs.ditto.live, the Cloud HTTP API
  and Edge Server HTTP API) is already captured under all/ditto-live, so no artifacts
  were generated here — the correct disposition is duplicate retirement into ditto-live
  per the merge procedure, which is a human-reviewed step.'
